<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clause / 契約書レビュー</title>
    <style>
      :root {
        --ink: #1c2530;
        --muted: #7b8793;
        --line: #dfe5e7;
        --line-strong: #cbd5d8;
        --paper: #fbfaf7;
        --canvas: #eef2f1;
        --panel: #ffffff;
        --navy: #102334;
        --teal: #2c9a8d;
        --teal-soft: #e0f2ef;
        --amber: #c98634;
        --amber-soft: #fff3dc;
        --red: #c85c5a;
        --red-soft: #fff0ef;
        --shadow: 0 16px 40px rgba(26, 42, 52, 0.08);
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        color: var(--ink);
        background: var(--canvas);
        min-width: 1188px;
      }

      button, textarea, select { font: inherit; }
      button { cursor: pointer; }

      .app-shell { min-height: 100vh; display: flex; flex-direction: column; }

      .topbar {
        height: 72px;
        padding: 0 32px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: #f8fbfb;
        background: var(--navy);
      }

      .brand { display: flex; align-items: center; gap: 12px; }
      .brand-mark {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border-radius: 9px;
        color: #a7f0df;
        background: rgba(81, 203, 182, 0.16);
        font-size: 18px;
        font-weight: 800;
      }
      .brand-name { font-size: 18px; font-weight: 800; letter-spacing: .04em; }
      .brand-sub { margin-left: 3px; color: #9eabb4; font-size: 11px; letter-spacing: .1em; }

      .topbar-actions { display: flex; align-items: center; gap: 18px; }
      .saved-state { display: flex; align-items: center; gap: 7px; color: #afbdc4; font-size: 12px; }
      .saved-state::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #67c7ac; }
      .topbar-icon {
        width: 36px;
        height: 36px;
        border: 1px solid rgba(255,255,255,.14);
        border-radius: 10px;
        color: #c8d4d8;
        background: transparent;
        font-size: 15px;
      }
      .avatar { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; color: #153043; background: #bfece2; font-size: 12px; font-weight: 800; }

      .workspace {
        width: calc(100% - 48px);
        min-width: 1140px;
        margin: 0 auto;
        padding: 26px 0 42px;
        flex: 1;
      }

      .page-heading { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 22px; }
      .eyebrow { margin: 0 0 8px; color: var(--teal); font-size: 11px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
      h1 { margin: 0; color: var(--ink); font-size: 27px; letter-spacing: -.03em; }
      .heading-meta { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; }
      .draft-pill { padding: 5px 9px; border: 1px solid #e4d9b8; border-radius: 20px; color: #98651f; background: #fff9e8; font-size: 11px; font-weight: 700; }

      .workspace-grid { display: grid; grid-template-columns: minmax(460px, calc(50% - 10px)) minmax(560px, calc(50% - 10px)); gap: 20px; align-items: start; }
      .card { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); box-shadow: var(--shadow); }

      .editor-card { min-height: 720px; overflow: hidden; }
      .card-header { min-height: 68px; padding: 0 22px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
      .section-title { display: flex; align-items: center; gap: 11px; font-size: 14px; font-weight: 800; }
      .section-icon { width: 27px; height: 27px; display: grid; place-items: center; border-radius: 7px; color: #276f68; background: var(--teal-soft); font-size: 13px; }
      .tiny-label { color: var(--muted); font-size: 11px; letter-spacing: .05em; }
      .editor-toolbar { display: flex; align-items: center; gap: 8px; }
      .toolbar-button { width: 30px; height: 30px; border: 1px solid transparent; border-radius: 7px; color: #8b969e; background: transparent; font-size: 12px; font-weight: 700; }
      .toolbar-button:hover { border-color: var(--line); background: #f4f7f6; color: var(--ink); }

      .document-title { padding: 22px 28px 13px; color: #65727d; font-size: 12px; font-weight: 700; letter-spacing: .04em; }
      .editor-wrap { margin: 0 20px; display: grid; grid-template-columns: 44px 1fr; min-height: 565px; border: 1px solid #e5e8e6; border-radius: 10px; overflow: hidden; background: var(--paper); }
      .line-numbers { padding: 19px 11px 18px 0; color: #b0b9ba; border-right: 1px solid #eceeeb; background: #f5f6f2; font: 12px/1.86 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; text-align: right; user-select: none; }
      .line-numbers span { display: block; }
      textarea {
        width: 100%;
        min-height: 565px;
        padding: 18px 24px;
        resize: vertical;
        border: 0;
        outline: 0;
        color: #34414b;
        background: var(--paper);
        font: 13px/1.86 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Noto Sans Mono", monospace;
        letter-spacing: .01em;
      }
      textarea::selection { background: #ccebe6; }
      .editor-footer { display: flex; justify-content: space-between; padding: 14px 24px 16px; color: #9aa4aa; font-size: 11px; }
      .format-hint { display: flex; align-items: center; gap: 7px; }
      .md-badge { padding: 3px 5px; border-radius: 4px; color: #67757c; background: #edf1f0; font-size: 10px; font-weight: 800; }

      .sidebar { display: flex; flex-direction: column; gap: 14px; }
      .control-card { overflow: visible; }
      .control-block { padding: 20px 20px 18px; border-bottom: 1px solid var(--line); }
      .control-block:last-child { border-bottom: 0; }
      .control-heading { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
      .control-heading h2 { margin: 0; font-size: 13px; }
      .count { color: var(--teal); font-size: 11px; font-weight: 800; }

      .criteria { display: flex; flex-direction: column; gap: 8px; }
      .criteria-item { position: relative; display: flex; gap: 11px; padding: 12px 12px 12px 13px; border: 1px solid #e8eceb; border-radius: 9px; background: #fcfdfc; transition: .16s ease; }
      .criteria-item:hover { border-color: #b8dad4; background: #f8fcfb; }
      .criteria-item::after { content: attr(data-tooltip); position: absolute; z-index: 20; top: calc(100% + 7px); left: 0; width: 300px; padding: 11px 12px; border: 1px solid #c7dfdb; border-radius: 8px; color: #35545a; background: #f7fffd; box-shadow: 0 10px 24px rgba(26, 42, 52, .14); font-size: 10px; font-weight: 500; line-height: 1.6; opacity: 0; pointer-events: none; transform: translateY(-3px); transition: opacity .15s ease, transform .15s ease; }
      .criteria-item:hover::after, .criteria-item:focus-visible::after { opacity: 1; transform: translateY(0); }
      .criteria-item input { position: absolute; opacity: 0; pointer-events: none; }
      .checkmark { flex: 0 0 auto; width: 17px; height: 17px; margin-top: 1px; display: grid; place-items: center; border: 1px solid #becbca; border-radius: 5px; color: transparent; background: white; font-size: 11px; font-weight: 900; }
      .criteria-item input:checked + .checkmark { border-color: var(--teal); color: white; background: var(--teal); }
      .criteria-item input:focus-visible + .checkmark { outline: 3px solid rgba(44,154,141,.2); }
      .criteria-copy { min-width: 0; }
      .criteria-name { display: block; margin-bottom: 3px; font-size: 12px; font-weight: 800; }

      .model-options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; }
      .model-option { position: relative; }
      .model-option input { position: absolute; opacity: 0; }
      .model-label { display: block; padding: 12px; border: 1px solid var(--line); border-radius: 9px; background: #fff; transition: .16s ease; }
      .model-option input:checked + .model-label { border-color: var(--teal); box-shadow: 0 0 0 2px rgba(44,154,141,.1); background: #f3fbf9; }
      .model-option input:focus-visible + .model-label { outline: 3px solid rgba(44,154,141,.2); }
      .model-name { display: block; font-size: 11px; font-weight: 800; }

      .run-area { padding: 18px 20px 20px; background: #f8faf9; }
      .review-button { width: 100%; min-height: 48px; display: flex; align-items: center; justify-content: center; gap: 9px; border: 0; border-radius: 9px; color: white; background: var(--navy); box-shadow: 0 8px 16px rgba(16,35,52,.16); font-size: 13px; font-weight: 800; transition: .16s ease; }
      .review-button:hover { transform: translateY(-1px); background: #1a3549; box-shadow: 0 10px 20px rgba(16,35,52,.2); }
      .review-button:active { transform: translateY(0); }
      .review-button:disabled { cursor: wait; opacity: .75; }
      .button-symbol { width: 19px; height: 19px; display: grid; place-items: center; border: 1px solid rgba(255,255,255,.3); border-radius: 50%; font-size: 10px; }
      .run-note { margin: 10px 0 0; color: #8b969d; font-size: 10px; line-height: 1.5; text-align: center; }

      .results-card { display: none; overflow: hidden; }
      .results-card.is-visible { display: block; }
      .results-summary { display: flex; align-items: center; gap: 10px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
      .summary-icon { width: 29px; height: 29px; display: grid; place-items: center; border-radius: 50%; color: #277d6f; background: var(--teal-soft); font-size: 14px; font-weight: 900; }
      .summary-copy { flex: 1; }
      .summary-title { display: block; font-size: 12px; font-weight: 800; }
      .summary-meta { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; }
      .result-list { padding: 8px 14px 12px; }
      .result-item { display: flex; gap: 9px; padding: 11px 4px; border-bottom: 1px solid #edf0ef; }
      .result-item:last-child { border-bottom: 0; }
      .result-status { flex: 0 0 auto; width: 20px; height: 20px; display: grid; place-items: center; border-radius: 50%; font-size: 10px; font-weight: 900; }
      .result-status.pass { color: #277d6f; background: var(--teal-soft); }
      .result-status.warn { color: #a96c1d; background: var(--amber-soft); }
      .result-status.fail { color: #a94643; background: var(--red-soft); }
      .result-copy { min-width: 0; }
      .result-name { display: block; font-size: 11px; font-weight: 700; line-height: 1.4; }
      .result-detail { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; line-height: 1.45; }
      .provider-result { padding: 15px 16px 12px; border-bottom: 1px solid var(--line); }
      .provider-result:last-child { border-bottom: 0; }
      .provider-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
      .provider-name { display: block; font-size: 12px; font-weight: 800; }
      .provider-version { display: block; margin-top: 3px; color: var(--muted); font-size: 9px; }
      .provider-metrics { display: flex; gap: 7px; }
      .metric { min-width: 56px; padding: 5px 7px; border: 1px solid #e6ecea; border-radius: 6px; background: #fbfdfc; text-align: right; }
      .metric-label { display: block; color: var(--muted); font-size: 8px; }
      .metric-value { display: block; margin-top: 2px; color: var(--ink); font-size: 10px; font-weight: 800; }
      .error-panel { padding: 10px; border: 1px solid #f1cbca; border-radius: 7px; color: #a94643; background: var(--red-soft); font-size: 10px; line-height: 1.45; }
      .comparison-table-wrap { overflow-x: auto; }
      .comparison-table { width: 100%; min-width: 650px; border-collapse: separate; border-spacing: 0; table-layout: fixed; }
      .comparison-table th, .comparison-table td { border-right: 1px solid #edf0ef; border-bottom: 1px solid #edf0ef; vertical-align: middle; }
      .comparison-table th:last-child, .comparison-table td:last-child { border-right: 0; }
      .comparison-table th { padding: 12px 13px; color: var(--muted); background: #f8faf9; font-size: 10px; font-weight: 700; text-align: left; }
      .comparison-table th:first-child { width: 35%; }
      .comparison-table td { padding: 12px 13px; background: #fff; }
      .comparison-table tbody tr:last-child td { border-bottom: 0; }
      .criterion-cell { color: var(--ink); font-size: 11px; font-weight: 700; line-height: 1.4; }
      .model-column-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 7px; }
      .model-column-name { display: block; color: var(--ink); font-size: 11px; font-weight: 800; }
      .model-column-version { display: block; margin-top: 3px; color: var(--muted); font-size: 9px; font-weight: 400; }
      .model-state { white-space: nowrap; color: var(--muted); font-size: 9px; font-weight: 700; }
      .model-state.is-done { color: var(--teal); }
      .model-state.is-error { color: var(--red); }
      .model-metric-line { display: flex; gap: 8px; margin-top: 8px; color: var(--muted); font-size: 9px; font-weight: 400; }
      .model-metric-line strong { color: var(--ink); font-weight: 800; }
      .comparison-cell { min-height: 40px; }
      .comparison-cell-content { display: flex; align-items: center; gap: 8px; }
      .comparison-cell-copy { min-width: 0; }
      .comparison-cell-status { display: block; color: var(--ink); font-size: 10px; font-weight: 800; }
      .comparison-cell-risk { display: block; margin-top: 3px; color: var(--muted); font-size: 9px; }
      .comparison-cell-evidence { margin-top: 10px; padding-top: 8px; border-top: 1px solid #edf0ef; color: var(--muted); font-size: 9px; line-height: 1.45; }
      .evidence-details summary { color: var(--teal-dark); cursor: pointer; font-size: 9px; font-weight: 800; }
      .evidence-details summary::marker { color: var(--teal); }
      .evidence-quote { margin: 6px 0 0; padding: 7px 8px; border-left: 2px solid #b7ded7; color: #536a70; background: #f8fbfa; white-space: pre-wrap; font-size: 9px; line-height: 1.55; }
      .comparison-cell-evidence.is-empty { color: #8a989d; }
      .comparison-cell.is-pending { color: var(--muted); font-size: 10px; }
      .comparison-cell.is-error { color: var(--red); font-size: 10px; line-height: 1.4; }
      .comparison-cell .result-status { width: 22px; height: 22px; }

      .toast { position: fixed; right: 28px; bottom: 25px; padding: 12px 15px; border: 1px solid #b7ded7; border-radius: 9px; color: #276f68; background: #f4fffc; box-shadow: 0 10px 25px rgba(26,42,52,.12); font-size: 12px; opacity: 0; transform: translateY(8px); pointer-events: none; transition: .2s ease; }
      .toast.is-visible { opacity: 1; transform: translateY(0); }

    </style>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">C</div>
          <div>
            <span class="brand-name">CLAUSE</span><span class="brand-sub">CONTRACT REVIEW</span>
          </div>
        </div>
        <div class="topbar-actions">
          <span class="saved-state">自動保存済み</span>
          <button class="topbar-icon" type="button" aria-label="ヘルプ">?</button>
          <div class="avatar" aria-label="ユーザー">KS</div>
        </div>
      </header>

      <main class="workspace">
        <div class="page-heading">
          <div>
            <p class="eyebrow">Workspace / Contract review</p>
            <h1>契約書レビュー</h1>
          </div>
          <div class="heading-meta">
            <span>最終編集：たった今</span>
            <span class="draft-pill">DRAFT</span>
          </div>
        </div>

        <div class="workspace-grid">
          <section class="card editor-card" aria-labelledby="editor-heading">
            <div class="card-header">
              <div class="section-title">
                <span class="section-icon">✎</span>
                <span id="editor-heading">契約書本文</span>
                <span class="tiny-label">Markdown</span>
              </div>
              <div class="editor-toolbar" aria-label="編集ツール">
                <button class="toolbar-button" type="button" title="太字">B</button>
                <button class="toolbar-button" type="button" title="見出し">H</button>
                <button class="toolbar-button" type="button" title="リンク">↗</button>
                <button class="toolbar-button" type="button" title="全画面">⛶</button>
              </div>
            </div>

            <div class="document-title">業務委託契約書.md</div>
            <div class="editor-wrap">
              <div class="line-numbers" id="lineNumbers" aria-hidden="true"></div>
              <textarea id="contractText" spellcheck="false" aria-label="契約書本文"># 業務委託契約書

株式会社サンプル（以下「甲」という。）と山田太郎（以下「乙」という。）は、以下のとおり業務委託契約（以下「本契約」という。）を締結する。

## 第1条（目的）

甲は乙に対し、甲が指定するウェブサイトのデザインおよび関連する制作業務（以下「本業務」という。）を委託し、乙はこれを受託する。

## 第2条（委託料および支払方法）

1. 本業務の委託料は、月額50万円（消費税別）とする。
2. 甲は、乙からの請求書を受領した月の翌月末日までに、乙が指定する銀行口座へ振り込む方法により支払う。

## 第3条（契約期間）

本契約の有効期間は、2026年10月1日から2027年3月31日までとする。期間満了の1か月前までにいずれの当事者からも書面による更新拒絶の意思表示がない場合、本契約は同一条件で6か月間更新される。

## 第4条（秘密保持）

甲および乙は、本業務に関連して知り得た相手方の営業上、技術上その他一切の秘密情報を、相手方の事前の書面による承諾なく第三者に開示または漏えいしてはならない。

## 第5条（成果物の権利帰属）

本業務により乙が作成した成果物に関する著作権その他一切の知的財産権は、委託料の全額が支払われた時点で甲に移転する。

## 第6条（契約解除）

甲または乙が本契約に違反し、相当期間を定めた催告後も当該違反が是正されない場合、相手方は本契約を解除することができる。

## 第7条（準拠法）

本契約の成立、効力、解釈および履行については、日本法を準拠法とする。

以上</textarea>
            </div>
            <div class="editor-footer">
              <span class="format-hint"><span class="md-badge">MD</span> Markdown形式で入力できます</span>
              <span id="textStats">0文字 / 0行</span>
            </div>
          </section>

          <aside class="sidebar" aria-label="レビュー設定">
            <section class="card control-card">
              <div class="control-block">
                <div class="control-heading">
                  <h2>チェック観点</h2>
                  <span class="count" id="criteriaCount">5 / 5 選択中</span>
                </div>
                <div class="criteria">
                  <label class="criteria-item" tabindex="0" data-tooltip="確認する記述：委託業務の種類・作業内容、成果物・納品物または完了条件、甲乙の担当範囲。一般的な表現だけで、業務内容や成果物を具体的に特定できない場合は要注意です。">
                    <input type="checkbox" checked data-id="scope" data-name="業務範囲の明確性" />
                    <span class="checkmark">✓</span>
                    <span class="criteria-copy"><span class="criteria-name">業務範囲の明確性</span></span>
                  </label>
                  <label class="criteria-item" tabindex="0" data-tooltip="確認する記述：報酬額または算定方法、請求方法、支払期日または支払サイト。遅延損害金、振込手数料、実費精算の定めがある場合は、その内容も確認します。">
                    <input type="checkbox" checked data-id="payment" data-name="報酬・支払条件" />
                    <span class="checkmark">✓</span>
                    <span class="criteria-copy"><span class="criteria-name">報酬・支払条件</span></span>
                  </label>
                  <label class="criteria-item" tabindex="0" data-tooltip="確認する記述：対象となる知的財産権、帰属先または移転先、権利移転の時期、成果物の利用範囲。著作者人格権や第三者素材の扱いも確認します。">
                    <input type="checkbox" checked data-id="intellectual-property" data-name="知的財産権の帰属" />
                    <span class="checkmark">✓</span>
                    <span class="criteria-copy"><span class="criteria-name">知的財産権の帰属</span></span>
                  </label>
                  <label class="criteria-item" tabindex="0" data-tooltip="確認する記述：契約違反時の解除条件、催告・是正期間、損害賠償の対象・上限・責任範囲。甲乙の一方だけに過度な負担を課す記述がないかも確認します。">
                    <input type="checkbox" checked data-id="termination-liability" data-name="解除・損害賠償" />
                    <span class="checkmark">✓</span>
                    <span class="criteria-copy"><span class="criteria-name">解除・損害賠償</span></span>
                  </label>
                  <label class="criteria-item" tabindex="0" data-tooltip="確認する記述：契約に適用する国または地域の法律。裁判所の管轄や紛争解決地だけが定められていて、適用法が明示されていない場合は準拠法の記述とはみなしません。">
                    <input type="checkbox" checked data-id="governing-law" data-name="準拠法の明確性" />
                    <span class="checkmark">✓</span>
                    <span class="criteria-copy"><span class="criteria-name">準拠法の明確性</span></span>
                  </label>
                </div>
              </div>

              <div class="control-block">
                <div class="control-heading">
                  <h2>レビュー実行モード</h2>
                  <span class="tiny-label">モデルを選択</span>
                </div>
                <div class="model-options">
                  <label class="model-option">
                    <input type="checkbox" name="executionMode" value="gpt-5.6-luna" checked />
                    <span class="model-label"><span class="model-name">gpt-5.6-luna</span></span>
                  </label>
                  <label class="model-option">
                    <input type="checkbox" name="executionMode" value="jev" checked />
                    <span class="model-label"><span class="model-name">JEV</span></span>
                  </label>
                </div>
              </div>

              <div class="run-area">
                <button class="review-button" id="reviewButton" type="button"><span class="button-symbol">↗</span>レビューを実行</button>
                <p class="run-note">同じ契約書とチェック観点を選択したモデルへ送信します</p>
              </div>
            </section>

            <section class="card results-card" id="resultsCard" aria-live="polite">
              <div class="results-summary">
                <span class="summary-icon" id="summaryIcon">✓</span>
                <span class="summary-copy"><span class="summary-title">レビュー結果</span><span class="summary-meta" id="summaryMeta">実行すると結果が表示されます</span></span>
              </div>
              <div class="comparison-table-wrap" id="comparisonTableWrap"></div>
            </section>
          </aside>
        </div>
      </main>
      <div class="toast" id="toast" role="status">レビュー結果を更新しました</div>
    </div>

    <script>
      const contractText = document.getElementById('contractText');
      const lineNumbers = document.getElementById('lineNumbers');
      const textStats = document.getElementById('textStats');
      const criteriaCount = document.getElementById('criteriaCount');
      const criteriaInputs = [...document.querySelectorAll('.criteria-item input')];
      const reviewButton = document.getElementById('reviewButton');
      const resultsCard = document.getElementById('resultsCard');
      const comparisonTableWrap = document.getElementById('comparisonTableWrap');
      const summaryMeta = document.getElementById('summaryMeta');
      const summaryIcon = document.getElementById('summaryIcon');
      const toast = document.getElementById('toast');
      const modelInputs = [...document.querySelectorAll('input[name="executionMode"]')];

      const modelLabels = {
        'gpt-5.6-luna': 'gpt-5.6-luna',
        jev: 'JEV',
      };

      function escapeHtml(value) {
        return String(value).replace(/[&<>'"]/g, (character) => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;',
        }[character]));
      }

      function updateEditorMeta() {
        const lines = contractText.value.split('\n');
        lineNumbers.innerHTML = lines.map((_, index) => `<span>${index + 1}</span>`).join('');
        textStats.textContent = `${contractText.value.length.toLocaleString('ja-JP')}文字 / ${lines.length}行`;
      }

      function updateCriteriaCount() {
        const selected = criteriaInputs.filter((input) => input.checked).length;
        criteriaCount.textContent = `${selected} / ${criteriaInputs.length} 選択中`;
      }

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add('is-visible');
        window.clearTimeout(showToast.timer);
        showToast.timer = window.setTimeout(() => toast.classList.remove('is-visible'), 2600);
      }

      function formatTokens(value) {
        return value === null || value === undefined ? '-' : Number(value).toLocaleString('ja-JP');
      }

      function formatRiskScore(value) {
        return `${Math.round(Number(value || 0))} / 100`;
      }

      function modelKey(modelId) {
        return modelId === 'gpt-5.6-luna' ? 'gpt' : 'jev';
      }

      function cellId(modelId, criterionId) {
        return `cell-${modelKey(modelId)}-${criterionId}`;
      }

      function createComparisonTable(selected, modelIds) {
        const modelHeaders = modelIds.map((modelId) => {
          const key = modelKey(modelId);
          return `<th><div class="model-column-head"><div><span class="model-column-name">${escapeHtml(modelLabels[modelId])}</span><span class="model-column-version" id="version-${key}">実行待ち</span></div><span class="model-state" id="state-${key}">待機中</span></div><div class="model-metric-line"><span>Latency <strong id="latency-${key}">—</strong></span><span>Tokens <strong id="tokens-${key}">—</strong></span></div></th>`;
        }).join('');

        const rows = selected.map((input) => {
          const criterionId = input.dataset.id;
          const modelCells = modelIds.map((modelId) => `<td class="comparison-cell is-pending" id="${cellId(modelId, criterionId)}">待機中…</td>`).join('');
          return `<tr><td class="criterion-cell">${escapeHtml(input.dataset.name)}</td>${modelCells}</tr>`;
        }).join('');

        comparisonTableWrap.innerHTML = `<table class="comparison-table"><thead><tr><th>チェック項目</th>${modelHeaders}</tr></thead><tbody>${rows}</tbody></table>`;
        resultsCard.classList.add('is-visible');
      }

      function updateProgress(completed, total, elapsedMs) {
        if (completed < total) {
          summaryIcon.textContent = '…';
          summaryMeta.textContent = `${completed} / ${total}モデル応答済み · 受信した結果から表示中`;
          return;
        }
        summaryIcon.textContent = '✓';
        summaryMeta.textContent = `${total}モデル完了 · 全体レイテンシ ${elapsedMs} ms`;
      }

      function renderResultCell(item) {
        const statusClass = item.status === 'warning' ? 'warn' : item.status;
        const mark = item.status === 'pass' ? '✓' : item.status === 'warning' ? '!' : '×';
        const statusLabel = item.status === 'pass' ? 'PASS' : item.status === 'warning' ? 'WARNING' : 'FAIL';
        const evidence = item.evidence
          ? `<details class="evidence-details"><summary>根拠条文：${escapeHtml(item.evidence.label)}</summary><blockquote class="evidence-quote">${escapeHtml(item.evidence.text)}</blockquote></details>`
          : '<span class="comparison-cell-evidence is-empty">根拠条文なし</span>';
        return `<div class="comparison-cell-content"><span class="result-status ${statusClass}">${mark}</span><span class="comparison-cell-copy"><span class="comparison-cell-status">${statusLabel}</span><span class="comparison-cell-risk">危険度 ${formatRiskScore(item.riskScore)}</span></span></div><div class="comparison-cell-evidence">${evidence}</div>`;
      }

      function updateProviderResult(modelId, result, selected) {
        const key = modelKey(modelId);
        const state = document.getElementById(`state-${key}`);
        const version = document.getElementById(`version-${key}`);
        const latency = document.getElementById(`latency-${key}`);
        const tokens = document.getElementById(`tokens-${key}`);
        if (!state || !version || !latency || !tokens) return;

        if (result.error) {
          state.textContent = 'エラー';
          state.className = 'model-state is-error';
          version.textContent = '実行に失敗';
          selected.forEach((input) => {
            const cell = document.getElementById(cellId(modelId, input.dataset.id));
            if (cell) {
              cell.className = 'comparison-cell is-error';
              cell.textContent = result.error;
            }
          });
          return;
        }

        state.textContent = '完了';
        state.className = 'model-state is-done';
        version.textContent = result.resolvedModel || result.requestedModel;
        latency.textContent = `${result.latencyMs} ms`;
        tokens.textContent = formatTokens(result.usage.totalTokens);

        result.items.forEach((item) => {
          const cell = document.getElementById(cellId(modelId, item.criterionId));
          if (cell) {
            cell.className = 'comparison-cell';
            cell.innerHTML = renderResultCell(item);
          }
        });
      }

      async function requestProvider(modelId, payload, selected) {
        try {
          const response = await fetch('/api/review', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ...payload, executionMode: modelId }),
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || 'レビューに失敗しました');
          const result = data.results?.[0];
          if (!result) throw new Error('モデルから結果を取得できませんでした');
          updateProviderResult(modelId, result, selected);
        } catch (error) {
          updateProviderResult(modelId, {
            provider: modelId,
            requestedModel: modelId,
            resolvedModel: null,
            latencyMs: 0,
            usage: { totalTokens: null },
            items: [],
            error: error instanceof Error ? error.message : 'レビューに失敗しました',
          }, selected);
        }
      }

      async function runReview() {
        const selected = criteriaInputs.filter((input) => input.checked);
        const selectedModelIds = modelInputs.filter((input) => input.checked).map((input) => input.value);
        const modelIds = ['jev', 'gpt-5.6-luna'].filter((modelId) => selectedModelIds.includes(modelId));
        const executionMode = modelIds.length === 2 ? 'both' : modelIds[0];

        if (!contractText.value.trim()) {
          showToast('契約書本文を入力してください');
          contractText.focus();
          return;
        }
        if (!selected.length) {
          showToast('チェック観点を1つ以上選択してください');
          return;
        }
        if (!modelIds.length) {
          showToast('利用するモデルを1つ以上選択してください');
          return;
        }

        reviewButton.disabled = true;
        reviewButton.innerHTML = '<span class="button-symbol">…</span>レビュー中…';
        const payload = {
          contractText: contractText.value,
          criteriaIds: selected.map((input) => input.dataset.id),
        };
        const startedAt = performance.now();
        let completed = 0;
        createComparisonTable(selected, modelIds);
        updateProgress(0, modelIds.length, 0);

        await Promise.allSettled(modelIds.map(async (modelId) => {
          await requestProvider(modelId, payload, selected);
          completed += 1;
          updateProgress(completed, modelIds.length, Math.round(performance.now() - startedAt));
        }));

        reviewButton.disabled = false;
        reviewButton.innerHTML = '<span class="button-symbol">↗</span>レビューを再実行';
        showToast('レビュー結果を更新しました');
      }

      contractText.addEventListener('input', updateEditorMeta);
      criteriaInputs.forEach((input) => input.addEventListener('change', updateCriteriaCount));
      reviewButton.addEventListener('click', runReview);
      updateEditorMeta();
      updateCriteriaCount();
    </script>
  </body>
</html>
