<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clause / 契約書レビュー</title>
    <style>
      :root {
        --ink: #1c2530;
        --muted: #7b8793;
        --line: #dfe5e7;
        --line-strong: #cbd5d8;
        --paper: #fbfaf7;
        --canvas: #eef2f1;
        --panel: #ffffff;
        --navy: #102334;
        --teal: #2c9a8d;
        --teal-soft: #e0f2ef;
        --amber: #c98634;
        --amber-soft: #fff3dc;
        --red: #c85c5a;
        --red-soft: #fff0ef;
        --shadow: 0 16px 40px rgba(26, 42, 52, 0.08);
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        color: var(--ink);
        background: var(--canvas);
        min-width: 1080px;
      }

      button, textarea, select { font: inherit; }
      button { cursor: pointer; }

      .app-shell { min-height: 100vh; display: flex; flex-direction: column; }

      .topbar {
        height: 72px;
        padding: 0 32px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: #f8fbfb;
        background: var(--navy);
      }

      .brand { display: flex; align-items: center; gap: 12px; }
      .brand-mark {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border-radius: 9px;
        color: #a7f0df;
        background: rgba(81, 203, 182, 0.16);
        font-size: 18px;
        font-weight: 800;
      }
      .brand-name { font-size: 18px; font-weight: 800; letter-spacing: .04em; }
      .brand-sub { margin-left: 3px; color: #9eabb4; font-size: 11px; letter-spacing: .1em; }

      .topbar-actions { display: flex; align-items: center; gap: 18px; }
      .saved-state { display: flex; align-items: center; gap: 7px; color: #afbdc4; font-size: 12px; }
      .saved-state::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #67c7ac; }
      .topbar-icon {
        width: 36px;
        height: 36px;
        border: 1px solid rgba(255,255,255,.14);
        border-radius: 10px;
        color: #c8d4d8;
        background: transparent;
        font-size: 15px;
      }
      .avatar { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; color: #153043; background: #bfece2; font-size: 12px; font-weight: 800; }

      .workspace {
        width: min(1440px, calc(100% - 48px));
        margin: 0 auto;
        padding: 26px 0 42px;
        flex: 1;
      }

      .page-heading { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 22px; }
      .eyebrow { margin: 0 0 8px; color: var(--teal); font-size: 11px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
      h1 { margin: 0; color: var(--ink); font-size: 27px; letter-spacing: -.03em; }
      .heading-meta { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; }
      .draft-pill { padding: 5px 9px; border: 1px solid #e4d9b8; border-radius: 20px; color: #98651f; background: #fff9e8; font-size: 11px; font-weight: 700; }

      .workspace-grid { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 20px; align-items: start; }
      .card { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); box-shadow: var(--shadow); }

      .editor-card { min-height: 720px; overflow: hidden; }
      .card-header { min-height: 68px; padding: 0 22px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
      .section-title { display: flex; align-items: center; gap: 11px; font-size: 14px; font-weight: 800; }
      .section-icon { width: 27px; height: 27px; display: grid; place-items: center; border-radius: 7px; color: #276f68; background: var(--teal-soft); font-size: 13px; }
      .tiny-label { color: var(--muted); font-size: 11px; letter-spacing: .05em; }
      .editor-toolbar { display: flex; align-items: center; gap: 8px; }
      .toolbar-button { width: 30px; height: 30px; border: 1px solid transparent; border-radius: 7px; color: #8b969e; background: transparent; font-size: 12px; font-weight: 700; }
      .toolbar-button:hover { border-color: var(--line); background: #f4f7f6; color: var(--ink); }

      .document-title { padding: 22px 28px 13px; color: #65727d; font-size: 12px; font-weight: 700; letter-spacing: .04em; }
      .editor-wrap { margin: 0 20px; display: grid; grid-template-columns: 44px 1fr; min-height: 565px; border: 1px solid #e5e8e6; border-radius: 10px; overflow: hidden; background: var(--paper); }
      .line-numbers { padding: 19px 11px 18px 0; color: #b0b9ba; border-right: 1px solid #eceeeb; background: #f5f6f2; font: 12px/1.86 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; text-align: right; user-select: none; }
      .line-numbers span { display: block; }
      textarea {
        width: 100%;
        min-height: 565px;
        padding: 18px 24px;
        resize: vertical;
        border: 0;
        outline: 0;
        color: #34414b;
        background: var(--paper);
        font: 13px/1.86 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Noto Sans Mono", monospace;
        letter-spacing: .01em;
      }
      textarea::selection { background: #ccebe6; }
      .editor-footer { display: flex; justify-content: space-between; padding: 14px 24px 16px; color: #9aa4aa; font-size: 11px; }
      .format-hint { display: flex; align-items: center; gap: 7px; }
      .md-badge { padding: 3px 5px; border-radius: 4px; color: #67757c; background: #edf1f0; font-size: 10px; font-weight: 800; }

      .sidebar { display: flex; flex-direction: column; gap: 14px; }
      .control-card { overflow: hidden; }
      .control-block { padding: 20px 20px 18px; border-bottom: 1px solid var(--line); }
      .control-block:last-child { border-bottom: 0; }
      .control-heading { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
      .control-heading h2 { margin: 0; font-size: 13px; }
      .count { color: var(--teal); font-size: 11px; font-weight: 800; }

      .criteria { display: flex; flex-direction: column; gap: 8px; }
      .criteria-item { position: relative; display: flex; gap: 11px; padding: 12px 12px 12px 13px; border: 1px solid #e8eceb; border-radius: 9px; background: #fcfdfc; transition: .16s ease; }
      .criteria-item:hover { border-color: #b8dad4; background: #f8fcfb; }
      .criteria-item input { position: absolute; opacity: 0; pointer-events: none; }
      .checkmark { flex: 0 0 auto; width: 17px; height: 17px; margin-top: 1px; display: grid; place-items: center; border: 1px solid #becbca; border-radius: 5px; color: transparent; background: white; font-size: 11px; font-weight: 900; }
      .criteria-item input:checked + .checkmark { border-color: var(--teal); color: white; background: var(--teal); }
      .criteria-item input:focus-visible + .checkmark { outline: 3px solid rgba(44,154,141,.2); }
      .criteria-copy { min-width: 0; }
      .criteria-name { display: block; margin-bottom: 3px; font-size: 12px; font-weight: 800; }
      .criteria-description { display: block; color: var(--muted); font-size: 10px; line-height: 1.45; }

      .model-options { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
      .model-option { position: relative; }
      .model-option input { position: absolute; opacity: 0; }
      .model-label { display: block; padding: 12px; border: 1px solid var(--line); border-radius: 9px; background: #fff; transition: .16s ease; }
      .model-option input:checked + .model-label { border-color: var(--teal); box-shadow: 0 0 0 2px rgba(44,154,141,.1); background: #f3fbf9; }
      .model-option input:focus-visible + .model-label { outline: 3px solid rgba(44,154,141,.2); }
      .model-name { display: block; font-size: 11px; font-weight: 800; }
      .model-detail { display: block; margin-top: 5px; color: var(--muted); font-size: 9px; }

      .run-area { padding: 18px 20px 20px; background: #f8faf9; }
      .review-button { width: 100%; min-height: 48px; display: flex; align-items: center; justify-content: center; gap: 9px; border: 0; border-radius: 9px; color: white; background: var(--navy); box-shadow: 0 8px 16px rgba(16,35,52,.16); font-size: 13px; font-weight: 800; transition: .16s ease; }
      .review-button:hover { transform: translateY(-1px); background: #1a3549; box-shadow: 0 10px 20px rgba(16,35,52,.2); }
      .review-button:active { transform: translateY(0); }
      .review-button:disabled { cursor: wait; opacity: .75; }
      .button-symbol { width: 19px; height: 19px; display: grid; place-items: center; border: 1px solid rgba(255,255,255,.3); border-radius: 50%; font-size: 10px; }
      .run-note { margin: 10px 0 0; color: #8b969d; font-size: 10px; line-height: 1.5; text-align: center; }

      .results-card { display: none; overflow: hidden; }
      .results-card.is-visible { display: block; }
      .results-summary { display: flex; align-items: center; gap: 10px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
      .summary-icon { width: 29px; height: 29px; display: grid; place-items: center; border-radius: 50%; color: #277d6f; background: var(--teal-soft); font-size: 14px; font-weight: 900; }
      .summary-copy { flex: 1; }
      .summary-title { display: block; font-size: 12px; font-weight: 800; }
      .summary-meta { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; }
      .result-list { padding: 8px 14px 12px; }
      .result-item { display: flex; gap: 9px; padding: 11px 4px; border-bottom: 1px solid #edf0ef; }
      .result-item:last-child { border-bottom: 0; }
      .result-status { flex: 0 0 auto; width: 20px; height: 20px; display: grid; place-items: center; border-radius: 50%; font-size: 10px; font-weight: 900; }
      .result-status.pass { color: #277d6f; background: var(--teal-soft); }
      .result-status.warn { color: #a96c1d; background: var(--amber-soft); }
      .result-status.fail { color: #a94643; background: var(--red-soft); }
      .result-copy { min-width: 0; }
      .result-name { display: block; font-size: 11px; font-weight: 700; line-height: 1.4; }
      .result-detail { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; line-height: 1.45; }

      .toast { position: fixed; right: 28px; bottom: 25px; padding: 12px 15px; border: 1px solid #b7ded7; border-radius: 9px; color: #276f68; background: #f4fffc; box-shadow: 0 10px 25px rgba(26,42,52,.12); font-size: 12px; opacity: 0; transform: translateY(8px); pointer-events: none; transition: .2s ease; }
      .toast.is-visible { opacity: 1; transform: translateY(0); }

      @media (max-width: 1120px) {
        body { min-width: 0; }
        .workspace { width: calc(100% - 28px); }
        .workspace-grid { grid-template-columns: minmax(0, 1fr) 350px; }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">C</div>
          <div>
            <span class="brand-name">CLAUSE</span><span class="brand-sub">CONTRACT REVIEW</span>
          </div>
        </div>
        <div class="topbar-actions">
          <span class="saved-state">自動保存済み</span>
          <button class="topbar-icon" type="button" aria-label="ヘルプ">?</button>
          <div class="avatar" aria-label="ユーザー">KS</div>
        </div>
      </header>

      <main class="workspace">
        <div class="page-heading">
          <div>
            <p class="eyebrow">Workspace / Contract review</p>
            <h1>契約書レビュー</h1>
          </div>
          <div class="heading-meta">
            <span>最終編集：たった今</span>
            <span class="draft-pill">DRAFT</span>
          </div>
        </div>

        <div class="workspace-grid">
          <section class="card editor-card" aria-labelledby="editor-heading">
            <div class="card-header">
              <div class="section-title">
                <span class="section-icon">✎</span>
                <span id="editor-heading">契約書本文</span>
                <span class="tiny-label">Markdown</span>
              </div>
              <div class="editor-toolbar" aria-label="編集ツール">
                <button class="toolbar-button" type="button" title="太字">B</button>
                <button class="toolbar-button" type="button" title="見出し">H</button>
                <button class="toolbar-button" type="button" title="リンク">↗</button>
                <button class="toolbar-button" type="button" title="全画面">⛶</button>
              </div>
            </div>

            <div class="document-title">業務委託契約書.md</div>
            <div class="editor-wrap">
              <div class="line-numbers" id="lineNumbers" aria-hidden="true"></div>
              <textarea id="contractText" spellcheck="false" aria-label="契約書本文"># 業務委託契約書

株式会社サンプル（以下「甲」という。）と山田太郎（以下「乙」という。）は、以下のとおり業務委託契約（以下「本契約」という。）を締結する。

## 第1条（目的）

甲は乙に対し、甲が指定するウェブサイトのデザインおよび関連する制作業務（以下「本業務」という。）を委託し、乙はこれを受託する。

## 第2条（委託料および支払方法）

1. 本業務の委託料は、月額50万円（消費税別）とする。
2. 甲は、乙からの請求書を受領した月の翌月末日までに、乙が指定する銀行口座へ振り込む方法により支払う。

## 第3条（契約期間）

本契約の有効期間は、2026年10月1日から2027年3月31日までとする。期間満了の1か月前までにいずれの当事者からも書面による更新拒絶の意思表示がない場合、本契約は同一条件で6か月間更新される。

## 第4条（秘密保持）

甲および乙は、本業務に関連して知り得た相手方の営業上、技術上その他一切の秘密情報を、相手方の事前の書面による承諾なく第三者に開示または漏えいしてはならない。

## 第5条（成果物の権利帰属）

本業務により乙が作成した成果物に関する著作権その他一切の知的財産権は、委託料の全額が支払われた時点で甲に移転する。

## 第6条（契約解除）

甲または乙が本契約に違反し、相当期間を定めた催告後も当該違反が是正されない場合、相手方は本契約を解除することができる。

以上</textarea>
            </div>
            <div class="editor-footer">
              <span class="format-hint"><span class="md-badge">MD</span> Markdown形式で入力できます</span>
              <span id="textStats">0文字 / 0行</span>
            </div>
          </section>

          <aside class="sidebar" aria-label="レビュー設定">
            <section class="card control-card">
              <div class="control-block">
                <div class="control-heading">
                  <h2>チェック観点</h2>
                  <span class="count" id="criteriaCount">4 / 4 選択中</span>
                </div>
                <div class="criteria">
                  <label class="criteria-item">
                    <input type="checkbox" checked data-name="業務範囲の明確性" />
                    <span class="checkmark">✓</span>
                    <span class="criteria-copy"><span class="criteria-name">業務範囲の明確性</span><span class="criteria-description">委託する業務・成果物が具体的に定義されているか</span></span>
                  </label>
                  <label class="criteria-item">
                    <input type="checkbox" checked data-name="報酬・支払条件" />
                    <span class="checkmark">✓</span>
                    <span class="criteria-copy"><span class="criteria-name">報酬・支払条件</span><span class="criteria-description">金額、支払期日、遅延時の扱いが明確か</span></span>
                  </label>
                  <label class="criteria-item">
                    <input type="checkbox" checked data-name="知的財産権の帰属" />
                    <span class="checkmark">✓</span>
                    <span class="criteria-copy"><span class="criteria-name">知的財産権の帰属</span><span class="criteria-description">成果物の権利帰属と利用範囲に不足がないか</span></span>
                  </label>
                  <label class="criteria-item">
                    <input type="checkbox" checked data-name="解除・損害賠償" />
                    <span class="checkmark">✓</span>
                    <span class="criteria-copy"><span class="criteria-name">解除・損害賠償</span><span class="criteria-description">解除条件や責任範囲が一方的になっていないか</span></span>
                  </label>
                </div>
              </div>

              <div class="control-block">
                <div class="control-heading">
                  <h2>使用するLLM</h2>
                  <span class="tiny-label">モデルを選択</span>
                </div>
                <div class="model-options">
                  <label class="model-option">
                    <input type="radio" name="model" value="gpt-5.6-luna" checked />
                    <span class="model-label"><span class="model-name">gpt-5.6-luna</span><span class="model-detail">高速・バランス型</span></span>
                  </label>
                  <label class="model-option">
                    <input type="radio" name="model" value="jev" />
                    <span class="model-label"><span class="model-name">JEV</span><span class="model-detail">契約レビュー特化</span></span>
                  </label>
                </div>
              </div>

              <div class="run-area">
                <button class="review-button" id="reviewButton" type="button"><span class="button-symbol">↗</span>レビューを実行</button>
                <p class="run-note">選択した観点と契約書本文をLLMに送信して判定します</p>
              </div>
            </section>

            <section class="card results-card" id="resultsCard" aria-live="polite">
              <div class="results-summary">
                <span class="summary-icon">✓</span>
                <span class="summary-copy"><span class="summary-title">レビュー結果</span><span class="summary-meta" id="summaryMeta">gpt-5.6-luna · 4項目を確認</span></span>
              </div>
              <div class="result-list" id="resultList"></div>
            </section>
          </aside>
        </div>
      </main>
      <div class="toast" id="toast" role="status">レビュー結果を更新しました</div>
    </div>

    <script>
      const contractText = document.getElementById('contractText');
      const lineNumbers = document.getElementById('lineNumbers');
      const textStats = document.getElementById('textStats');
      const criteriaCount = document.getElementById('criteriaCount');
      const criteriaInputs = [...document.querySelectorAll('.criteria-item input')];
      const reviewButton = document.getElementById('reviewButton');
      const resultsCard = document.getElementById('resultsCard');
      const resultList = document.getElementById('resultList');
      const summaryMeta = document.getElementById('summaryMeta');
      const toast = document.getElementById('toast');

      function updateEditorMeta() {
        const lines = contractText.value.split('\n');
        lineNumbers.innerHTML = lines.map((_, index) => `<span>${index + 1}</span>`).join('');
        textStats.textContent = `${contractText.value.length.toLocaleString('ja-JP')}文字 / ${lines.length}行`;
      }

      function updateCriteriaCount() {
        const selected = criteriaInputs.filter((input) => input.checked).length;
        criteriaCount.textContent = `${selected} / ${criteriaInputs.length} 選択中`;
      }

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add('is-visible');
        window.clearTimeout(showToast.timer);
        showToast.timer = window.setTimeout(() => toast.classList.remove('is-visible'), 2600);
      }

      contractText.addEventListener('input', updateEditorMeta);
      criteriaInputs.forEach((input) => input.addEventListener('change', updateCriteriaCount));

      reviewButton.addEventListener('click', () => {
        const selected = criteriaInputs.filter((input) => input.checked);
        const model = document.querySelector('input[name="model"]:checked').value;

        if (!contractText.value.trim()) {
          showToast('契約書本文を入力してください');
          contractText.focus();
          return;
        }
        if (!selected.length) {
          showToast('チェック観点を1つ以上選択してください');
          return;
        }

        reviewButton.disabled = true;
        reviewButton.innerHTML = '<span class="button-symbol">…</span>レビュー中…';
        window.setTimeout(() => {
          const details = {
            '業務範囲の明確性': { status: 'pass', mark: '✓', message: '対象業務と成果物が記載されています。' },
            '報酬・支払条件': { status: 'pass', mark: '✓', message: '委託料と支払期日が明確に定められています。' },
            '知的財産権の帰属': { status: 'warn', mark: '!', message: '権利移転の範囲と利用許諾を追加確認してください。' },
            '解除・損害賠償': { status: 'fail', mark: '×', message: '損害賠償の上限・範囲に関する条項がありません。' },
          };

          resultList.innerHTML = selected.map((input) => {
            const item = details[input.dataset.name] || { status: 'warn', mark: '!', message: 'この観点は追加確認が必要です。' };
            return `<div class="result-item"><span class="result-status ${item.status}">${item.mark}</span><span class="result-copy"><span class="result-name">${input.dataset.name}</span><span class="result-detail">${item.message}</span></span></div>`;
          }).join('');
          summaryMeta.textContent = `${model} · ${selected.length}項目を確認`;
          resultsCard.classList.add('is-visible');
          reviewButton.disabled = false;
          reviewButton.innerHTML = '<span class="button-symbol">↗</span>レビューを再実行';
          showToast('レビュー結果を更新しました');
        }, 900);
      });

      updateEditorMeta();
      updateCriteriaCount();
    </script>
  </body>
</html>
